<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />

    <title>Guillermo Villar — Computer engineer</title>
    <meta
      name="description"
      content="Portfolio of Guillermo Villar Sánchez, a computer engineer in Madrid working on machine learning, cryptography and web projects. Includes an in-browser handwritten digit recogniser."
    />
    <link rel="canonical" href="https://g-villar.tech/" />

    <!--
      Security headers GitHub Pages will not send for us. frame-ancestors is
      deliberately absent: it is ignored in a meta CSP, so clickjacking
      protection genuinely needs a host that can set response headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://eu.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph: without these, every shared link rendered as a blank box. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guillermo Villar" />
    <meta property="og:title" content="Guillermo Villar — Computer engineer" />
    <meta
      property="og:description"
      content="Machine learning, cryptography and things that have to actually run. Projects, writing and an in-browser handwritten digit recogniser."
    />
    <meta property="og:url" content="https://g-villar.tech/" />
    <meta property="og:image" content="https://g-villar.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Guillermo Villar Sánchez — computer engineer, Madrid" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guillermo Villar — Computer engineer" />
    <meta
      name="twitter:description"
      content="Machine learning, cryptography and things that have to actually run."
    />
    <meta name="twitter:image" content="https://g-villar.tech/og-image.png" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The stylesheet pulls Roboto Mono; warm the font origins up front. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
